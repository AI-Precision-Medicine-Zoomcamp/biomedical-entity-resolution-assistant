[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build-meta"

[project]
name = "biomedical-entity-resolution-assistant"
version = "0.1.0"
description = "A Precision Medicine AI assistant for resolving biomedical entities"
readme = "README.md"
authors = [
    { name = "James" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "streamlit>=1.24.0",
    "rapidfuzz>=3.1.0",
    "chromadb>=0.4.0",
    "spacy>=3.5.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "black>=23.3.0",
    "isort>=5.12.0",
]
